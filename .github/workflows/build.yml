name: Gerar APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Instalar o Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar o Gradle (com cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Mostrar erros do Kotlin como anotações
        run: echo "::add-matcher::.github/kotlin-problem-matcher.json"

      - name: Rodar os testes de unidade
        run: |
          chmod +x gradlew
          ./gradlew testPadraoDebugUnitTest --stacktrace

      - name: Compilar os APKs (padrão e completo)
        run: ./gradlew assemblePadraoDebug assembleCompletoDebug --stacktrace

      - name: Renomear os APKs
        run: |
          cp app/build/outputs/apk/padrao/debug/app-padrao-debug.apk Afrodite.apk
          cp app/build/outputs/apk/completo/debug/app-completo-debug.apk Afrodite-completo.apk

      - name: Guardar os APKs como artefato
        uses: actions/upload-artifact@v6
        with:
          name: Afrodite-apks
          path: |
            Afrodite.apk
            Afrodite-completo.apk

      - name: Publicar na release "ultima-versao" (link direto)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-versao --cleanup-tag --yes || true
          gh release create ultima-versao Afrodite.apk Afrodite-completo.apk \
            --title "Afrodite — última versão" \
            --notes "Gerado automaticamente a partir do commit ${GITHUB_SHA::7}. **Afrodite.apk**: instale este pelo celular. **Afrodite-completo.apk**: só pelo computador (adb install), veja o README." \
            --target "$GITHUB_SHA" \
            --latest
